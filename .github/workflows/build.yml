name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачиваем файлы проекта
        uses: actions/checkout@v4

      - name: Устанавливаем системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Устанавливаем Buildozer и Cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Кэшируем скомпилированные библиотеки
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Сборка APK
        run: |
          yes | buildozer -v android debug

      - name: Загружаем готовый APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: FastImageUpscaler-APK
          path: bin/*.apk
