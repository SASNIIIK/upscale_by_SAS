name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Освобождаем место на диске (очистка мусора VM)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Скачиваем файлы проекта
        uses: actions/checkout@v4

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Устанавливаем системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Устанавливаем Buildozer и Cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Принудительно устанавливаем Android SDK и API 33
        run: |
          buildozer android update || true
          SDKMANAGER=$(find ~/.buildozer -name "sdkmanager" | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null
            "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"
          fi

      - name: Сборка APK
        run: |
          yes | buildozer -v android debug

      - name: Загружаем готовый APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: FastImageUpscaler-APK
          path: bin/*.apk
